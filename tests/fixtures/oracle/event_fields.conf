input {
  generator {
    count => 1
    message => "hello 😀"
  }
}

filter {
  mutate {
    add_field => {
      "[@metadata][beat]" => "filebeat"
      "[foo][bar]" => "nested"
      "[deep][a][b]" => "leaf"
      "plain" => "top"
    }
    remove_field => ["sequence"]
  }
  mutate {
    add_field => {
      "copied" => "%{[foo][bar]}"
      "meta_copy" => "%{[@metadata][beat]}"
      "missing" => "%{[no][such]}"
      "day" => "%{+YYYY.MM.dd}"
      "quoted" => "say \"hi\""
      "slash" => "a\\b"
    }
    add_tag => ["alpha", "beta", "%{[foo][bar]}"]
    remove_field => ["[deep][a][b]"]
  }
  mutate {
    add_field => {
      "epoch" => "%{+%s}"
      "java_day" => "%{{yyyy-MM-dd}}"
      "msg_copy" => "%{message}"
      "tags_join" => "%{tags}"
      "foo_json" => "%{[foo]}"
    }
  }
}

output {
  stdout {
    codec => json_lines
  }
}
